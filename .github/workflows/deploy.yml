name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_SENDER_ID: ${{ secrets.AT_SENDER_ID }}
          AT_SANDBOX: ${{ secrets.AT_SANDBOX }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_ACCESS_TOKEN_MINUTES: ${{ secrets.JWT_ACCESS_TOKEN_MINUTES }}
          JWT_REFRESH_TOKEN_DAYS: ${{ secrets.JWT_REFRESH_TOKEN_DAYS }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: DB_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_USE_SSL,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_ADDRESS,SMTP_FROM_NAME,AT_USERNAME,AT_API_KEY,AT_SENDER_ID,AT_SANDBOX,JWT_SECRET,JWT_ISSUER,JWT_AUDIENCE,JWT_ACCESS_TOKEN_MINUTES,JWT_REFRESH_TOKEN_DAYS,NEXTAUTH_SECRET
          script: |
            set -e

            # ── Pull API repo ─────────────────────────────────────────────────
            echo "==> Pulling API repo..."
            cd /root/propertypro-api
            git fetch --prune
            git reset --hard origin/main

            # ── Write .env from CI secrets ────────────────────────────────────
            esc() { printf '%s' "$1" | sed 's/\$/\$\$/g'; }

            echo "==> Writing .env..."
            cd /root/propertypro-api/deploy
            {
            echo "DB_PASSWORD=$(esc "${DB_PASSWORD}")"
            echo "SMTP_HOST=$(esc "${SMTP_HOST}")"
            echo "SMTP_PORT=$(esc "${SMTP_PORT}")"
            echo "SMTP_USE_SSL=$(esc "${SMTP_USE_SSL}")"
            echo "SMTP_USERNAME=$(esc "${SMTP_USERNAME}")"
            echo "SMTP_PASSWORD=$(esc "${SMTP_PASSWORD}")"
            echo "SMTP_FROM_ADDRESS=$(esc "${SMTP_FROM_ADDRESS}")"
            echo "SMTP_FROM_NAME=$(esc "${SMTP_FROM_NAME}")"
            echo "AT_USERNAME=$(esc "${AT_USERNAME}")"
            echo "AT_API_KEY=$(esc "${AT_API_KEY}")"
            echo "AT_SENDER_ID=$(esc "${AT_SENDER_ID}")"
            echo "AT_SANDBOX=$(esc "${AT_SANDBOX}")"
            echo "JWT_SECRET=$(esc "${JWT_SECRET}")"
            echo "JWT_ISSUER=$(esc "${JWT_ISSUER}")"
            echo "JWT_AUDIENCE=$(esc "${JWT_AUDIENCE}")"
            echo "JWT_ACCESS_TOKEN_MINUTES=$(esc "${JWT_ACCESS_TOKEN_MINUTES}")"
            echo "JWT_REFRESH_TOKEN_DAYS=$(esc "${JWT_REFRESH_TOKEN_DAYS}")"
            echo "NEXTAUTH_SECRET=$(esc "${NEXTAUTH_SECRET}")"
            } > .env

            # ── Rebuild only the app container (never touch db, web, caddy) ──
            echo "==> Rebuilding app container..."
            docker compose up --build -d --no-deps app

            # ── Wait for app to come up ───────────────────────────────────────
            echo "==> Waiting for app to start..."
            for i in $(seq 1 20); do
              STATE=$(docker inspect --format='{{.State.Status}}' deploy-app-1 2>/dev/null || echo "missing")
              if [ "$STATE" = "running" ]; then
                echo "App is running."
                break
              fi
              echo "Waiting... ($i/20) state=$STATE"
              sleep 4
            done

            echo "==> Container status:"
            docker compose ps

            echo "==> App logs (last 20 lines):"
            docker compose logs --tail=20 app

            echo "==> Deploy complete."
